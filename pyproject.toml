[project]
name = "todo_cli"
version = "0.1.0"
description = "A clean, reliable command-line todo application demonstrating all basic CRUD operations with file-based JSON persistence."
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
authors = []

[project.scripts]
todo-cli = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []

# Pyproject.toml for UV environment management
# This project uses only Python standard library, so no external dependencies are needed.
